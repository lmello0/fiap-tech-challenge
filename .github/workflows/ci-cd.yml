name: CI/CD

on:
  push:
    branches: [fase2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  MINIKUBE_VERSION: v1.39.0
  TERRAFORM_VERSION: 1.15.8

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build, test and verify architecture and coverage
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports
            target/site/jacoco
          retention-days: 7

  image:
    name: Docker image
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: workshop:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save the image for the deploy job
        run: docker save workshop:local -o workshop-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-image
          path: workshop-image.tar
          retention-days: 1
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image
        if: github.event_name == 'push'
        run: |
          docker tag workshop:local "$IMAGE_NAME:${{ github.sha }}"
          docker tag workshop:local "$IMAGE_NAME:fase2"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:fase2"

  deploy:
    name: Deploy to Kubernetes
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: workshop-image
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Install minikube
        run: |
          curl -fsSLo minikube "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64"
          sudo install minikube /usr/local/bin/minikube
          minikube version
      - name: Provision the cluster, the database and deploy the manifests
        env:
          CLUSTER_CPUS: "3"
          CLUSTER_MEMORY: 7000mb
          IMAGE_TAR: workshop-image.tar
        run: ./infra/up.sh
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl --context workshop -n workshop get pods,svc,hpa,events -o wide || true
          kubectl --context workshop -n workshop describe pods || true
          kubectl --context workshop -n workshop logs deploy/workshop --tail=200 || true
          kubectl --context workshop -n workshop logs deploy/keycloak --tail=200 || true
          docker ps -a || true
      - name: Tear down
        if: always()
        run: ./infra/down.sh
