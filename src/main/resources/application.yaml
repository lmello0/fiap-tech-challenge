spring:
  application:
    name: workshop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workshop}
    username: ${DB_USER:workshop_app}
    password: ${DB_PASSWORD:workshop_app}
  flyway:
    enabled: false # one Flyway per module, see ModuleMigrations
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  modulith:
    events:
      jdbc:
        schema: events
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/workshop}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/workshop/protocol/openid-connect/certs}

server:
  port: 8080

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    oauth:
      client-id: workshop-swagger
      use-pkce-with-authorization-code-grant: true

workshop:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
    realm: workshop
    admin-client-id: workshop-admin
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:workshop-admin-secret}
