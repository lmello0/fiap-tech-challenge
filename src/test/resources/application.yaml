spring:
  jpa:
    show-sql: false

  # MailSenderAutoConfiguration is conditional on spring.mail.host, and EmailDispatcher needs the
  # bean it creates. EmailDeliveryIT overrides these to point at its Mailpit container; every other
  # test just needs the bean to exist.
  mail:
    host: localhost
    port: 1025

  modulith:
    events:
      republish-outstanding-events-on-restart: false
      staleness:
        # Tightened from the 2m used in production so a recovery test does not have to wait it out.
        published: 1s
        processing: 1s
        resubmitted: 1s
        check-interval: 1s

app:
  mail:
    from: no-reply@techchallenge.test
    from-name: Tech Challenge Test
    max-attempts: 3
    # Effectively disables the scheduled pass; recovery tests invoke the job directly.
    retry-delay: 1h

  events:
    retention: 30d
    purge-cron: "0 45 3 * * ?"

  inventory:
    # Effectively disables the scheduled sweep; expiry tests invoke the service method directly.
    reservation-ttl: 7d
    reservation-expiry-cron: "0 15 3 * * ?"
    reorder-sweep-cron: "0 0 4 * * ?"
    average-window: 20
    vendor:
      mock:
        lead-time-days: 3

  scheduling:
    # Matches the values AvailabilityServiceTest/AppointmentTokenServiceTest construct by hand for
    # their plain-unit-test SchedulingProperties instances.
    min-notice: 2h
    max-lookahead: 30d
    access-token-ttl: 7d
    registration-token-ttl: 7d
    pickup-invitation-token-ttl: 14d
    # Effectively disables the scheduled sweep; no-show tests would invoke the service directly.
    no-show-sweep-cron: "0 0 4 * * ?"

    email:
      base-url: http://localhost:4200

  auth:
    email:
      base-url: http://localhost:4200
    jwt:
      secret: test-signing-secret-that-is-long-enough-for-hs256
      issuer: http://localhost/tech-challenge-test
      access-token-ttl: 5m
      refresh-token-ttl: 1h
    rate-limit:
      max-attempts: 5
      lock-duration: 15m
    verification:
      password-reset-ttl: 15m
      email-verification-ttl: 24h
      email-change-ttl: 24h
