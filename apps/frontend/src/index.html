THESIS: A work order is a job at a numbered step, carrying preconditions that name who may

tiles, no white cards on grey, no sidebar of generic icons.

OWN-WORLD: Pulp stock #EAEAE5 drifting warm and cool, press ink #161A1D never pure black,
functional spot colour only — #C2321B blocking/terminal, #A86E0D awaiting (darkened from #D08A16

press ink, not chroma. Barlow and Barlow Semi Condensed carry display and caption alike; Azeret
Mono is reserved for identifiers. Bleed section tabs numbered to the manual's own index, hairline
rules, registration marks, no floating panels, no category glyphs.

STORY: Staff read the whole shop in a glance, see the next lawful step and who may perform it,
and perform it in place.
