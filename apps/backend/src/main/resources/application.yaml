spring:
  application:
    name: tech-challenge

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true

  web:
    error:
      whitelabel:
        enabled: false

  mail:
    host: ${MAILPIT_HOST:localhost}
    port: ${MAILPIT_PORT:1025}

  modulith:
    events:
      # A single recovery path: RetryFailedEmails owns resubmission, so restart must not fire a
      # second one that ignores the per-message expiry.
      republish-outstanding-events-on-restart: false
      staleness:
        # Without `resubmitted`, a retry that fails again stays RESUBMITTED and is never retried
        # a second time — the retry budget would silently be 1 instead of app.mail.max-attempts.
        published: 2m
        processing: 2m
        resubmitted: 2m

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

# One JSON object per log line (ADR 0017), built into Boot's logging system since 3.4 — no extra
# encoder dependency needed. `context.include` (on by default) is what folds every LogContext.put
# field into the line, since those only ever land in MDC.
logging:
  structured:
    format:
      console: logstash

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  mail:
    from: ${MAIL_FROM:no-reply@techchallenge.local}
    from-name: ${MAIL_FROM_NAME:Tech Challenge}
    max-attempts: 3
    retry-delay: 1m

  events:
    retention: 30d
    purge-cron: "0 45 3 * * ?"

  inventory:
    reservation-ttl: 7d
    reservation-expiry-cron: "0 15 3 * * ?"
    reorder-sweep-cron: "0 0 4 * * ?"
    average-window: 20
    vendor:
      mock:
        lead-time-days: 3

  scheduling:
    min-notice: 2h
    max-lookahead: 30d
    access-token-ttl: 7d
    registration-token-ttl: 7d
    pickup-invitation-token-ttl: 14d
    no-show-sweep-cron: "0 */15 * * * ?"

    email:
      base-url: ${APP_BASE_URL:http://localhost:4200}

  auth:
    purge-expired-tokens-cron: "0 30 3 * * ?"

    email:
      base-url: ${APP_BASE_URL:http://localhost:4200}

    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      access-token-ttl: 5m
      refresh-token-ttl: 1h

    rate-limit:
      max-attempts: 5
      lock-duration: 15m

    verification:
      password-reset-ttl: 15m
      email-verification-ttl: 24h
      email-change-ttl: 24h

    bootstrap-manager:
      email: ${BOOTSTRAP_MANAGER_EMAIL:}
      password: ${BOOTSTRAP_MANAGER_PASSWORD:}
      first-name: ${BOOTSTRAP_MANAGER_FIRST_NAME:}
      last-name: ${BOOTSTRAP_MANAGER_LAST_NAME:}
      document-type: ${BOOTSTRAP_MANAGER_DOCUMENT_TYPE:CPF}
      document-code: ${BOOTSTRAP_MANAGER_DOCUMENT_CODE:}
      phone: ${BOOTSTRAP_MANAGER_PHONE:}

    cors:
      allowed-origins:
        - "http://localhost:4200"

  workorder:
    budget-decision-token:
      secret: ${BUDGET_DECISION_TOKEN_SECRET}

    email:
      base-url: ${APP_BASE_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: '*'