{
  "openapi": "3.1.0",
  "info": {
    "title": "Auto repair shop API",
    "description": "Auto repair shop management API: customer and vehicle registration, service scheduling, work order and budget lifecycle, and inventory control.",
    "version": "1.0"
  },
  "servers": [
    {
      "url": "http://localhost:8080",
      "description": "Generated server url"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "tags": [
    {
      "name": "Vendors",
      "description": "Vendors that parts and services can be purchased from."
    },
    {
      "name": "Part Stock",
      "description": "Derived stock standing per part: on-hand, available, status, and windowed cost."
    },
    {
      "name": "Stock",
      "description": "Manual stock corrections and the movement ledger for a single part."
    },
    {
      "name": "Appointments",
      "description": "Drop-off/pickup scheduling: staff booking and management, customer self-service, and guest token-based flows."
    },
    {
      "name": "Auth",
      "description": "Registration, login, session, password, and email verification/change flows."
    },
    {
      "name": "Scheduling Settings",
      "description": "Shop-wide scheduling settings and closure days."
    },
    {
      "name": "Budgets",
      "description": "Staff-only Budget draft editing and send lifecycle."
    },
    {
      "name": "Work Orders",
      "description": "Staff-facing work order lifecycle: creation, diagnostics, repair execution, and delivery."
    },
    {
      "name": "History",
      "description": "Generic staff read surface over any aggregate's recorded Timeline."
    },
    {
      "name": "Repair Services",
      "description": "Labor/service catalog: code, price, and estimated/average execution time."
    },
    {
      "name": "Workers",
      "description": "MANAGER-only worker management, plus a worker's self-service profile update."
    },
    {
      "name": "Parts",
      "description": "Inventory Part catalog: SKU, pricing, and on-hand/reserved stock levels."
    },
    {
      "name": "Customers",
      "description": "Staff management of Customer accounts: list, view, update, deactivate, reactivate."
    },
    {
      "name": "Vehicles",
      "description": "Customer vehicle registration and management."
    },
    {
      "name": "Stock Policies",
      "description": "Per-part, per-vendor automatic-reorder thresholds."
    },
    {
      "name": "Users",
      "description": "The authenticated caller's own profile, plus worker-only user lookups."
    },
    {
      "name": "Purchase Orders",
      "description": "Placing, receiving, and cancelling purchase orders sent to vendors."
    },
    {
      "name": "Customer Work Orders",
      "description": "Customer-scoped view of a work order: status, its Budget, and approve/refuse actions."
    },
    {
      "name": "Work Order Readiness",
      "description": "Whether a work order's parts are fully reserved yet."
    }
  ],
