services:
  postgres:
    image: 'postgres:18'
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres:/var/lib/postgresql/18/docker
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit:/data
    ports:
      - '8025:8025'
      - '1025:1025'

  sonarqube:
    image: 'sonarqube:community'
    restart: unless-stopped
    profiles: [ sonar ]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: secret
      SONAR_FORCEAUTHENTICATION: false
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    ports:
      - '9000:9000'
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"
      ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 80s
    depends_on:
      postgres:
        condition: service_healthy

  sonar-analysis:
    image: maven:3.9-amazoncorretto-25
    restart: no
    profiles: [ sonar ]
    working_dir: /usr/src
    volumes:
      - .:/usr/src
      - maven_repository:/root/.m2
      - ./scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_USER: admin
      SONAR_PASSWORD: admin
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      DOCKER_HOST: unix:///var/run/docker.sock
    depends_on:
      sonarqube:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "/scripts/sonar-analysis.sh" ]

volumes:
  postgres:
  mailpit:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_temp:
  maven_repository:
