apiVersion: batch/v1
kind: Job
metadata:
  name: workshop-load-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: workshop-load-test
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:1.8.2
          args: ["run", "/scripts/load-test.js"]
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: script
          configMap:
            name: workshop-load-test
