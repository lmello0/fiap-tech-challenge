x-backend-base: &backend-base
  build:
    context: ./apps/backend
    dockerfile: Dockerfile
  env_file:
    - ./apps/backend/.env
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/auto_repair_shop
    MAILPIT_HOST: mailpit
    SPRING_PROFILES_ACTIVE: local
  ports:
    - '8080:8080'
  healthcheck:
    test: [ "CMD-SHELL", "wget -qO- --tries=1 http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"' || exit 1" ]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 15s

services:
  postgres:
    image: 'postgres:18'
    restart: unless-stopped
    profiles: [ app, sonar, services ]
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres:/var/lib/postgresql/18/docker
      - ./apps/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    profiles: [ app, sonar, services ]
    environment:
      TZ: America/Sao_Paulo
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit:/data
    ports:
      - '8025:8025'
      - '1025:1025'
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null --tries=1 http://localhost:8025/readyz || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  sonarqube:
    image: 'sonarqube:community'
    restart: unless-stopped
    profiles: [ sonar ]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: secret
      SONAR_FORCEAUTHENTICATION: false
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    ports:
      - '9000:9000'
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"
      ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 80s
    depends_on:
      postgres:
        condition: service_healthy

  sonar-analysis:
    image: maven:3.9-amazoncorretto-25
    restart: no
    profiles: [ sonar ]
    working_dir: /usr/src
    volumes:
      - ./apps/backend:/usr/src
      - maven_repository:/root/.m2
      - ./scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_USER: admin
      SONAR_PASSWORD: admin
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      DOCKER_HOST: unix:///var/run/docker.sock
    depends_on:
      sonarqube:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "/scripts/sonar-analysis.sh" ]

  backend:
    <<: *backend-base
    profiles: [ app ]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    profiles: [ app ]
    ports:
      - '4200:80'
    depends_on:
      backend:
        condition: service_healthy

  backend-pipeline:
    <<: *backend-base
    profiles: [ sonar ]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      sonar-analysis:
        condition: service_completed_successfully

volumes:
  postgres:
  mailpit:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_temp:
  maven_repository:
